[project]
name = "mcp-agent-mail"
version = "0.1.0"
description = "Standalone MCP email client with GPG cryptography — key material never enters the LLM context window."
readme = "README.md"
authors = [
    { name = "ChristofMilius" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0",
    "python-gnupg>=0.5.6",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-agent-mail = "mcp_agent_mail:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [".venv", "data", "logs", "exported_keys"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["mcp_agent_mail"]
omit = ["*/tool_surface/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]